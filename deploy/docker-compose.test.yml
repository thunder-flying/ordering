services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ordering_test
      MYSQL_PASSWORD: ordering_test_password
      MYSQL_ROOT_PASSWORD: root_test_password
      MYSQL_USER: ordering
    ports:
      - "127.0.0.1:33070:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -uordering -pordering_test_password ordering_test -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./mysql-test-init:/docker-entrypoint-initdb.d:ro
