services:
  mysql-ordering:
    container_name: mysql-ordering
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ordering
      MYSQL_PASSWORD: "123456"
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_USER: ordering
    ports:
      - "127.0.0.1:33070:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql --protocol=TCP -h 127.0.0.1 -uordering -p123456 ordering -e 'SELECT 1' >/dev/null 2>&1",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./mysql-ordering-init:/docker-entrypoint-initdb.d:ro
