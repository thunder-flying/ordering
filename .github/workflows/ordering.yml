name: Ordering verify and deploy

on:
  pull_request:
  push:
    branches: [dev, master, main]

permissions:
  contents: read

concurrency:
  group: ordering-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ordering
          MYSQL_USER: ordering
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: test-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: mysql://ordering:test-password@127.0.0.1:3306/ordering
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ordering/server prisma:migrate
      - run: pnpm run verify:server
      - run: pnpm run verify:miniapp
      - run: python3 -m unittest discover -s deploy/next/tests -p '*_policy.py' -v

  publish:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ordering-server:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: tooling
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ordering-tooling:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ORDERING_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure verified SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 0700 -d "$RUNNER_TEMP/ordering-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ordering-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ordering-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ordering-ssh/id_ed25519" "$RUNNER_TEMP/ordering-ssh/known_hosts"
      - name: Deploy SHA images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          ssh_args=(-i "$RUNNER_TEMP/ordering-ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ordering-ssh/known_hosts" -p "${DEPLOY_PORT:-22}")
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          app_image="ghcr.io/${{ github.repository_owner }}/ordering-server:$RELEASE_SHA"
          tooling_image="ghcr.io/${{ github.repository_owner }}/ordering-tooling:$RELEASE_SHA"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_args[@]}" "$remote" "sudo -n bash /opt/ordering/deploy/next/scripts/release.sh '$app_image' '$tooling_image' '$GHCR_USER'"
